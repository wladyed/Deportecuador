limit_req_zone $binary_remote_addr zone=intake:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=admin_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=assistant:10m rate=30r/m;
server {
 listen 80;
 server_name _;
 absolute_redirect off;
 root /usr/share/nginx/html;
 client_max_body_size 32k;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header X-Frame-Options DENY always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' ; font-src 'self' ; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 location /api/v1/requests {
  limit_req zone=intake burst=4 nodelay;
  limit_req_status 429;
  limit_except POST {deny all;}
  proxy_pass http://backend:8080;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
 }
 location ~ ^/(oauth2/authorization/google|login/oauth2/code/google)$ {
  limit_req zone=admin_auth burst=15 nodelay;
  limit_req_status 429;
  proxy_pass http://backend:8080;
  proxy_set_header Host $http_host;
 }
 location /api/admin/auth/ {
  # Authentication endpoints retain their existing rate limit.
  limit_req zone=admin_auth burst=15 nodelay;
  limit_req_status 429;
  proxy_pass http://backend:8080;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
 }
 location = /api/v1/assistant/bookings {
  limit_req zone=intake burst=4 nodelay;
  limit_req_status 429;
  proxy_pass http://backend:8080;
  proxy_set_header Host $http_host;
 }
 location /api/v1/assistant/ {
  limit_req zone=assistant burst=10 nodelay;
  limit_req_status 429;
  proxy_pass http://backend:8080;
  proxy_set_header Host $http_host;
 }
 location /api/admin/ {
  proxy_pass http://backend:8080;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
 }
 location = /api/admin/media {
  client_max_body_size 11m;
  proxy_pass http://backend:8080;
  proxy_set_header Host $http_host;
 }
 location /api/v1/media/ {
  limit_except GET {deny all;}
  proxy_pass http://backend:8080;
  proxy_set_header Host $http_host;
 }
 location = /admin { return 302 /admin/; }
 location /admin/ { proxy_pass http://cms:80; }
 location /api/ {return 403;}
 location = /api/whatsapp/webhook {
  proxy_pass http://backend:8080;
  proxy_set_header Host $http_host;
 }
 location /api/v1/content/ {
  limit_except GET {deny all;}
  proxy_pass http://backend:8080;
  proxy_set_header Host $http_host;
 }
 location / {try_files $uri @public_ssr;}
 location = / {proxy_pass http://public-ssr:4000; proxy_set_header Host $http_host;}
 location @public_ssr {proxy_pass http://public-ssr:4000; proxy_set_header Host $http_host;}
}
