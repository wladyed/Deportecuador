name: deportecuador
services:
  web:
    build: ./apps/public
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
      cms:
        condition: service_started
      public-ssr:
        condition: service_started
    restart: unless-stopped
  public-ssr:
    build:
      context: ./apps/public
      target: renderer
    environment:
      CONTENT_API_ORIGIN: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  cms:
    build: ./apps/cms
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/deportecuador
      DB_USER: deportecuador
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in .env}
      FILESERVER_ROOT: /data/files
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
      ADMIN_PUBLIC_ORIGIN: ${ADMIN_PUBLIC_ORIGIN:-http://localhost:8081}
      GOOGLE_OIDC_ENABLED: ${GOOGLE_OIDC_ENABLED:-false}
      GOOGLE_OIDC_DOMAIN: ${GOOGLE_OIDC_DOMAIN:-deportecuador.com.ec}
      GOOGLE_OIDC_CLIENT_ID: ${GOOGLE_OIDC_CLIENT_ID:-}
      GOOGLE_OIDC_CLIENT_SECRET: ${GOOGLE_OIDC_CLIENT_SECRET:-}
      GOOGLE_OIDC_REDIRECT_URI: ${GOOGLE_OIDC_REDIRECT_URI:-http://localhost:8081/login/oauth2/code/google}
      GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}
      GOOGLE_CALENDAR_REFRESH_TOKEN: ${GOOGLE_CALENDAR_REFRESH_TOKEN:-}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      MAIL_FROM: info@deportecuador.com.ec
      MAIL_ADMIN: info@deportecuador.com.ec
    volumes:
      - files:/data/files
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: deportecuador
      POSTGRES_USER: deportecuador
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deportecuador -d deportecuador"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped
volumes:
  postgres:
  files:
