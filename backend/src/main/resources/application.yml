server:
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        name: DE_ADMIN_SESSION
        http-only: true
        same-site: lax
        secure: ${ADMIN_COOKIE_SECURE:false}
spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/deportecuador}
    username: ${DB_USER:deportecuador}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mail:
    host: ${SMTP_HOST:mailpit}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  auth:
    public-origin: ${ADMIN_PUBLIC_ORIGIN:http://localhost:8081}
    google:
      enabled: ${GOOGLE_OIDC_ENABLED:false}
      domain: ${GOOGLE_OIDC_DOMAIN:deportecuador.com.ec}
      client-id: ${GOOGLE_OIDC_CLIENT_ID:}
      client-secret: ${GOOGLE_OIDC_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_OIDC_REDIRECT_URI:http://localhost:8081/login/oauth2/code/google}
  calendar:
    client-id: ${GOOGLE_CALENDAR_CLIENT_ID:}
    client-secret: ${GOOGLE_CALENDAR_CLIENT_SECRET:}
    refresh-token: ${GOOGLE_CALENDAR_REFRESH_TOKEN:}
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
    app-secret: ${WHATSAPP_APP_SECRET:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    phone-id: ${WHATSAPP_PHONE_ID:}
    api-version: ${WHATSAPP_API_VERSION:}
    public-url: ${PUBLIC_SITE_URL:}
  storage:
    provider: filesystem
    root: ${FILESERVER_ROOT:/data/files}
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:info@deportecuador.com.ec}
    admin: ${MAIL_ADMIN:info@deportecuador.com.ec}
